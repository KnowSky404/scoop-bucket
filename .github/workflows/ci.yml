name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoop-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          path: bucket_repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Save compatible test dependencies from PowerShell Gallery
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $moduleRoot = Join-Path $env:RUNNER_TEMP 'bucket-test-modules'
          New-Item -ItemType Directory -Path $moduleRoot -Force | Out-Null
          Save-Module BuildHelpers -MinimumVersion 2.0.1 -Path $moduleRoot -Force
          Save-Module Pester -MinimumVersion 5.2.0 -Path $moduleRoot -Force
          "BUCKET_TEST_MODULES=$moduleRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Run Scoop manifest tests and static safety assertions
        run: |
          $env:PSModulePath = "$env:BUCKET_TEST_MODULES;$env:PSModulePath"
          $env:SCOOP_HOME = "$(Convert-Path '.\scoop_core')"
          .\bucket_repo\bin\test.ps1
  checksum:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Verify official release URL and SHA256 without installing fonts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:SCOOP_HOME = "$(Convert-Path '.\scoop_core')"
          ./scripts/check-hashes.ps1
