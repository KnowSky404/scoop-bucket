name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoop-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          path: bucket_repo
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Install test dependencies from PowerShell Gallery
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          if ('${{ matrix.shell }}' -eq 'powershell') { Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force | Out-Null }
          Install-Module BuildHelpers -MinimumVersion 2.0.1 -Scope CurrentUser -Force
          Install-Module Pester -MinimumVersion 5.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run Scoop manifest tests and static safety assertions
        run: |
          $env:SCOOP_HOME = "$(Convert-Path '.\scoop_core')"
          .\bucket_repo\bin\test.ps1
  checksum:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          path: scoop_core
      - name: Verify official release URL and SHA256 without installing fonts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $env:SCOOP_HOME = "$(Convert-Path '.\scoop_core')"
          ./scripts/check-hashes.ps1
