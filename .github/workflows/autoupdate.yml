name: Upstream release updates
on:
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:
    inputs:
      verify_pr_creation:
        description: 'Create, verify, close a temporary Draft PR and delete its test branch (no manifest changes)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: upstream-manifest-update
  cancel-in-progress: false
jobs:
  propose:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify release and propose reviewed update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update-manifest.ps1 -CreatePullRequest
      - name: Verify actual GITHUB_TOKEN Draft PR permission and clean up
        if: github.event_name == 'workflow_dispatch' && inputs.verify_pr_creation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/test-pr-permission.ps1
